<label class="zone" [class.dragging]="dragging()"
       (dragover)="onDragOver($event)" (dragleave)="dragging.set(false)" (drop)="onDrop($event)">
  <input type="file" accept="image/*" (change)="onChange($event)" hidden />
  <span class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v4h14v-4" />
    </svg>
  </span>
  <strong>Déposez votre photo de chantier</strong>
  <span>ou <b>parcourez vos fichiers</b> pour la sélectionner</span>
  <small>Images JPG ou PNG</small>
</label>
